<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornos · Lista de Serviço Extra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sigma.css?v=3">
</head>
<body data-page="listop" data-title="Possível abertura de ZR">
<div class="screen">
  <header id="hdr"></header>
  <main class="stage"><section class="panel">
    <div class="toggle"><span class="on">PARADA</span><span>ROTINA</span></div>
    <div class="grid" style="grid-template-columns:.7fr 3fr">
      <div class="grid" style="grid-template-rows:1.2fr 1fr 1fr">
        <div class="box"><div class="cap">% Realizado geral</div><div class="gauge"><div class="gaugebox" id="gOp"></div></div></div>
        <div class="kbox"><span class="k">Total</span><span class="v num" id="opTot">—</span></div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="kbox"><span class="k">Realizado</span><span class="v num" style="color:var(--ok)" id="opRea">—</span></div>
          <div class="kbox"><span class="k">Pendente</span><span class="v num" style="color:var(--bad)" id="opPen">—</span></div>
        </div>
      </div>
      <div class="box"><div class="cap">Possível abertura de ZR · escopo extra achado em campo</div><div class="scroll"><table id="tOp"></table></div></div>
    </div>
  </section></main>
  <footer id="ftr"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="tv-dados.js"></script>
<script src="sigma.js"></script>
<script>/* QR gerado aqui mesmo quando a biblioteca carregou; senão fica o serviço externo */
(function(){function troca(){if(typeof QRCode==="undefined")return;document.querySelectorAll("img[src*=\"qrserver\"]").forEach(function(im){var u=decodeURIComponent((im.src.split("data=")[1]||"").split("&")[0]).replace("campo.sigmacode","fornos.sigmacode");var d=document.createElement("div");new QRCode(d,{text:u,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});var c=d.querySelector("canvas");if(c)im.src=c.toDataURL("image/png")})}setTimeout(troca,400);setTimeout(troca,1600)})();</script>
</body>
</html>
