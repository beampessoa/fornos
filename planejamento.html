<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Portal do Planejamento · Fornos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

/* Layout: o mesmo do Painel Gerencial de Campo (campo-graf.html): cabeçalho branco com logo azul, KPIs, painéis brancos com cabeçalho e corpo */
:root{
  --blue:#0F4CBA; --blue-700:#0B3A91; --blue-300:#5B8AE6;
  --green:#22C55E; --green-600:#16A34A;
  --canvas:#F1F4F9; --panel:#FFFFFF; --ink:#1F2937; --ink-soft:#4B5563; --muted:#6B7280;
  --line:#E5E7EB; --field:#F4F6FA; --field-line:#D7DEEA; --stage:#F6F8FB;
  --s-nao:#9CA3AF; --s-and:#0F4CBA; --s-esp:#F59E0B; --s-pen:#EF4444; --s-lib:#16A34A;
  --s-nao-bg:#F1F3F6; --s-and-bg:#E8EFFC; --s-esp-bg:#FFF7E6; --s-pen-bg:#FDECEC; --s-lib-bg:#E7F6EE;
  --s-nao-tx:#4B5563; --s-and-tx:#0B3A91; --s-esp-tx:#92400E; --s-pen-tx:#991B1B; --s-lib-tx:#166534;
  --font-d:'Exo 2',system-ui,sans-serif; --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:8px; --r-md:12px; --r-lg:16px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#5B8AE6; --blue-700:#8FB0F0; --blue-300:#3B67C4;
  --canvas:#0F141B; --panel:#171E28; --ink:#E5EAF1; --ink-soft:#B8C2CF; --muted:#8B97A6;
  --line:#263140; --field:#1D2632; --field-line:#2E3A4A; --stage:#E9EDF2;
  --s-nao:#9CA3AF; --s-and:#4F7FE0; --s-esp:#F59E0B; --s-pen:#F05252; --s-lib:#22C55E;
  --s-nao-bg:#232C38; --s-and-bg:#18294A; --s-esp-bg:#3A2A0E; --s-pen-bg:#3D1A1A; --s-lib-bg:#123A22;
  --s-nao-tx:#C3CAD4; --s-and-tx:#A9C2F5; --s-esp-tx:#F8C567; --s-pen-tx:#F8A5A5; --s-lib-tx:#86E0A8;
  --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --blue:#5B8AE6; --blue-700:#8FB0F0; --blue-300:#3B67C4;
  --canvas:#0F141B; --panel:#171E28; --ink:#E5EAF1; --ink-soft:#B8C2CF; --muted:#8B97A6;
  --line:#263140; --field:#1D2632; --field-line:#2E3A4A; --stage:#E9EDF2;
  --s-nao:#9CA3AF; --s-and:#4F7FE0; --s-esp:#F59E0B; --s-pen:#F05252; --s-lib:#22C55E;
  --s-nao-bg:#232C38; --s-and-bg:#18294A; --s-esp-bg:#3A2A0E; --s-pen-bg:#3D1A1A; --s-lib-bg:#123A22;
  --s-nao-tx:#C3CAD4; --s-and-tx:#A9C2F5; --s-esp-tx:#F8C567; --s-pen-tx:#F8A5A5; --s-lib-tx:#86E0A8;
  --sh:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
body{font-family:var(--font-ui);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--panel)}
.es-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.es-header .logo{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.es-header .logo svg{width:20px;height:20px}
.es-header .tit{min-width:190px;flex:1 1 auto}
.es-header .tt{font-family:var(--font-d);font-weight:800;font-size:16px;line-height:1.1}
.es-header .st{font-size:11.5px;color:var(--muted)}
.tag-prot{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--s-esp-tx);background:var(--s-esp-bg);border:1px solid var(--s-esp);border-radius:20px;padding:5px 11px;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh);min-width:0}
.kpi .n{font-family:var(--font-d);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .n small{font-size:14px;color:var(--muted);font-weight:700}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.kpi.forno{border-top:3px solid var(--s-pen)}
.kpi.forno.ok{border-top-color:var(--s-lib)}
.trava{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pil{font-family:var(--font-d);font-weight:800;font-size:22px;line-height:1}
.duas{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.duas{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;min-width:0}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.panel-h .tt{font-weight:800;font-size:14px}
.panel-h .q{font-size:11.5px;color:var(--muted);margin-top:3px}
.acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.uchip{font-family:var(--font-ui);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.uchip:hover{background:var(--field)}
.uchip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r);font-family:var(--font-ui);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
.hbtn:hover{background:var(--field)}
.hbtn svg{width:15px;height:15px}
.hbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
button:focus-visible,select:focus-visible,.zrow:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.palco{background:var(--stage)}
.palco svg{display:block;width:100%;height:auto}
.zona{cursor:pointer;mix-blend-mode:multiply;transition:fill-opacity .15s}
.zona:hover,.zona.ativa{fill-opacity:.62!important}
.zona.ativa{stroke-width:3.5!important}
.sem-area .zona{display:none}
.ed .zona{pointer-events:none}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-soft)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.lista{list-style:none;margin:0;padding:6px 8px}
.zrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:var(--r);cursor:pointer;border-bottom:1px solid var(--line)}
.zrow:last-child{border-bottom:0}
.zrow:hover{background:var(--field)}
.zrow.ativa{background:var(--field);box-shadow:inset 3px 0 0 var(--blue)}
.num{font-family:var(--font-d);font-size:12px;font-weight:800;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff}
.zn{font-family:var(--font-d);font-weight:700;font-size:13px;line-height:1.25}
.zm{font-size:11.5px;color:var(--muted)}
.barra{grid-column:2/4;height:4px;background:var(--field);border-radius:3px;overflow:hidden}
.barra span{display:block;height:100%;border-radius:3px}
.chip{font-size:11px;font-weight:800;letter-spacing:.02em;border-radius:20px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.fora{font-size:12px;color:var(--muted);padding:10px 18px 14px;border-top:1px solid var(--line);line-height:1.55}
.fora b{font-family:var(--font-d);color:var(--ink)}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;padding:16px 18px}
.det h3{font-family:var(--font-d);font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.trilho{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.trilho div{height:30px;border-radius:6px;font:800 11px var(--font-d);display:grid;place-items:center}
.trilho-rot{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.2;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.med{margin:0;padding:0;list-style:none;font-size:12.5px}
.med li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.med li:last-child{border-bottom:0}
.med code{font-family:var(--font-d);font-weight:700;font-size:11.5px;color:var(--blue);background:var(--field);border:1px solid var(--field-line);border-radius:6px;padding:1px 6px;white-space:nowrap;align-self:start}
.aviso{border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;line-height:1.55;margin-top:12px;border:1px solid}
.aviso b{font-weight:800}
.edbar{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid #FDE68A;background:#FFFBEB;font-size:12.5px;color:#92400E}
.ed .edbar{display:flex}
.edbar label{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
select{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:var(--r);padding:7px 10px;cursor:pointer}
.nota{font-size:12px;color:var(--muted);max-width:90ch;line-height:1.6;margin:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.es-header{--s-na:#6E8A7C}
:root{--s-na:#6E8A7C;--s-canc:#9CA3AF}
.es-header .quem{font-size:12px;font-weight:700;color:var(--ink-soft);text-align:right;line-height:1.3}
.es-header .quem small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.lnk{background:none;border:0;color:var(--blue);font:700 12.5px var(--font-ui);cursor:pointer;padding:0}
.head h1{font-family:var(--font-d);font-size:23px;font-weight:800;line-height:1.2;margin:0}
.head p{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.55;max-width:80ch}
.voltar{display:inline-flex;align-items:center;gap:6px;font:700 12.5px var(--font-ui);color:var(--blue);background:none;border:0;cursor:pointer;padding:0;margin-bottom:6px}
.voltar svg{width:14px;height:14px}
/* entrada por PIN */
.login{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:24px 22px;max-width:440px;margin:30px auto;width:100%}
.login h1{font-family:var(--font-d);font-size:19px;font-weight:800;margin:0 0 5px}
.login .lead{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 16px}
.fg{display:grid;gap:5px;min-width:0}
.fg label{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--field-line);border-radius:var(--r);background:var(--field);font:500 14px var(--font-ui);color:var(--ink)}
.inp:focus{outline:2px solid var(--blue-300);outline-offset:1px}
.pin{letter-spacing:10px;text-align:center;font-weight:800;font-size:22px;-webkit-text-security:disc}
.pick{display:grid;gap:7px;margin-top:10px}
.pick button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.pick button:hover{border-color:var(--blue-300);background:var(--field)}
.pick b{display:block;font-size:13px}.pick small{font-size:11px;color:var(--muted)}
.hit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--s-lib-bg);border:1px solid var(--s-lib);margin-top:10px}
.hit .av{background:var(--s-lib)}
.miss{padding:10px 12px;border-radius:var(--r);background:var(--s-pen-bg);border:1px solid var(--s-pen);color:var(--s-pen-tx);font-size:12.5px;font-weight:600;line-height:1.5;margin-top:10px}
.dica{font-size:11.5px;color:var(--s-esp-tx);background:var(--s-esp-bg);border-radius:var(--r);padding:8px 10px;margin-top:12px;line-height:1.5}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:var(--r);border:1px solid transparent;font:700 12.5px var(--font-ui);cursor:pointer;text-decoration:none;white-space:nowrap}
.bt-p{background:var(--blue);color:#fff}.bt-p:hover{background:var(--blue-700)}
.bt-g{background:var(--panel);color:var(--ink-soft);border-color:var(--line)}.bt-g:hover{background:var(--field)}
.bt-v{background:#0B893F;color:#fff}.bt-v:hover{background:#08662F}
.bt[disabled]{opacity:.5;cursor:default}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;flex:none;display:grid;place-items:center;font:800 14px var(--font-d)}
/* hub */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer;text-align:left;font:inherit;padding:0;transition:transform .12s,border-color .12s}
.mod:hover{transform:translateY(-2px);border-color:var(--c)}
.mod .fx{height:5px;background:var(--c)}
.mod .corpo{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.mod .ic{width:42px;height:42px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.mod .ic svg{width:21px;height:21px}
.mod h3{font-family:var(--font-d);font-size:16px;font-weight:800;line-height:1.25;margin:0}
.mod p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini span{font-size:11px;font-weight:700;background:var(--field);color:var(--ink-soft);padding:4px 9px;border-radius:20px}
.mod .go{margin-top:auto;font-size:12.5px;font-weight:800;color:var(--c)}
/* barra de filtros */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh)}
.bar .sp{flex:1}
.bar select,.bar .inp{padding:8px 10px;font-size:13px}
.bar .busca{min-width:220px}
.kpis.p{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpis.p .kpi .n{font-size:24px}
/* RDC */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.sem{border-style:dashed}
.card .topo{display:flex;align-items:flex-start;gap:11px}
.card .nm{font-family:var(--font-d);font-size:14.5px;font-weight:800;line-height:1.25}
.card .fx2{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.selo{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;margin-left:auto}
.selo.fechado{background:var(--s-lib-bg);color:var(--s-lib-tx)}.selo.rascunho{background:var(--s-esp-bg);color:var(--s-esp-tx)}.selo.ausente{background:var(--field);color:var(--muted)}
.nbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb{background:var(--field);border-radius:var(--r);padding:9px 8px;text-align:center}
.nb b{display:block;font:800 17px var(--font-d);line-height:1.1}
.nb span{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;line-height:1.25}
.frente{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.pbar{height:7px;border-radius:20px;background:var(--field);overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:20px}
.pcts{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;gap:8px}
.card .acs{display:flex;gap:8px;margin-top:auto}.card .acs .bt{flex:1}
/* listas */
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .av{background:#0B893F}
.prow .nm{font-size:13.5px;font-weight:700}
.prow .fx2{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:auto}
.tw table{font-size:12.5px}
.tw th{background:var(--field);padding:9px 10px;white-space:nowrap;position:sticky;top:0}
.tw td{padding:9px 10px}
.cod{font-family:var(--font-d);font-weight:800;white-space:nowrap}
.cod a{color:var(--ink);text-decoration:none}.cod a:hover{color:var(--blue)}
.sub2{font-size:11px;color:var(--muted);margin-top:2px}
.sn{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}
.sn.sim{background:var(--s-pen-bg);color:var(--s-pen-tx)}.sn.nao{background:var(--field);color:var(--muted)}.sn.ns{background:var(--s-esp-bg);color:var(--s-esp-tx)}
.sn.pend{background:var(--s-esp-bg);color:var(--s-esp-tx);border:1px solid var(--s-esp)}.sn.ok{background:var(--s-lib-bg);color:var(--s-lib-tx)}
.sn.p1{background:#C62828;color:#fff}.sn.p2{background:#F59E0B;color:#3F2207}.sn.p3{background:var(--field);color:var(--ink-soft)}
.vz{color:var(--muted);font-size:11.5px}
.vazio{padding:40px 18px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6;background:var(--panel);border:1px dashed var(--field-line);border-radius:var(--r-lg)}
.vazio b{display:block;color:var(--ink-soft);font-family:var(--font-d);font-size:14px;margin-bottom:4px}
.zn2{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:800 10.5px var(--font-d);margin-right:6px;vertical-align:-6px}
.tw select{padding:6px 8px;font-size:12.5px;max-width:220px}
.tw tr.mud td{background:var(--s-and-bg)}
/* etiquetas */
.etq{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.etq{grid-template-columns:minmax(0,1fr)}}
.elista{max-height:540px;overflow:auto;padding:6px 8px}

 catalizador incluíndo os respectivos pigtails inferiores do tubo até o coletor, sendo eles: na parede oeste os tubos A42 até F52 e na parede leste tubos A1 até F3 (os tubos F52, F51 e E52 já foram removidos);\n\nProvidenciar e planejar a substituição de mais 10 colunas/tubos a serem definidos após a medição total dos tubos;\n\nProvidenciar e planejar a substituição de mais 16 pigtails completos a serem definidos após a medição total dos pigtails;\n\nTodos os tubos e pigtails removidos devem ser identificados e armazenados até a definição de quais serão descartados e quais serão ensaiados, será realizada medição na base das colunas removidas antes ou após a remoção;\n\nNas novas colunas deverá ser realizada medição de diâmetro em 6 alturas (cada coluna é composto por 3 tubos, serão 2 medições por tubo) e uma medição de carbono em cada tubo das colunas (providenciar preparação de superfície, energia e deslocamento do equipamento). As colunas devem ser rastreáveis quanto a sua posição após instaladas no forno.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.6", "linha": 29, "forno": "02", "cod": "1.6", "nota": "ZR-14658907", "sade": [], "tipo": "END", "zonas": ["COL"], "titulo": "Pigtail Inferior · Ensaios", "det": "Montar acesso aos distribuidores que interligam aos pigtail inferior de todas as fileiras e remover completamente o isolamento térmico dos pigtail e coletores. (atentar com a suportação dos pigtails);\n\nRealizar medição de diâmetro em 3 pontos de todos os pigtails, sendo um no tubo inicial (junto ao tubo de catalizador), um abaixo da solda do tubo inicial e um na lira (a ser definido);\n\nRealizar ensaio de LP na ligação do Pigtail com o tubo coletor em 60 pontos distribuídos pelos coletores a serem definidos entre os que não serão substituídos.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.7", "linha": 30, "forno": "02", "cod": "1.7", "nota": "ZR-14658907", "sade": [], "tipo": "ISOL", "zonas": ["COL"], "titulo": "Pigtail Inferior ·  Isolamento", "det": "Após ensaios recompor o isolamento térmico dos coletores e pigtails inferiores conforme o projeto DE-REPLAN-4241-42-00013, ou proposta similar aprovada por grupo interdisciplinar. O modelo atual não atende, o isolamento deve envolver todo o comprimento do tubo e não permitir deslizamento.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.8", "linha": 31, "forno": "02", "cod": "1.8", "nota": "ZR-14658907", "sade": [], "tipo": "INST", "zonas": ["COL"], "titulo": "Coletores · Instalar skin-points", "det": "Instalar skin-points nas extremidades dos tubos coletores, conforme projeto. Na ausência de projeto serão soldados apenas os contatos nos tubos para implementação em campanha. / No mínimo 6 skin-points, entre o 4º e 5º pigtails apartir das extremidades de cada coletor. Preferencialmente, prever outros 6 skin-point s a serem instalados mais próximos dos Tês.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.9", "linha": 32, "forno": "02", "cod": "1.9", "nota": "ZR-14658907", "sade": [], "tipo": "END", "zonas": ["COL"], "titulo": "Pigtail Superior · Ensaios", "det": "Remover isolamento completo de 12 pigtails superiores a serem definidos para inspeção amostral e prevera reposição após ensaios;\n\nRealizar ensaio de LP na na ligação do Pigtail com o tubo distribuidor dos 12 pigtails.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.10", "linha": 33, "forno": "02", "cod": "1.10", "nota": "ZR-14658907", "sade": [], "tipo": "ISOL", "zonas": ["RAD"], "titulo": "Teto do forno · Isolamento", "det": "Manter e manutenir o isolamento térmico fixo na extremidade dos tubos de catalizador, junto a entrada do pigtail;\n\nInstalar isolamento sanfonado abaixo da entrada do pigtail até o teto do forno, de forma reter o calor quando da expansão dos tubos. Modelo a ser proposto e aprovado;\n\nRemover as cortinas instaladas entre as fileiras, mantendo apenas uma cortina funcional em ambos os lados de cada corredor que possa ser deslizada em todo o compimento da fileira.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.11", "linha": 34, "forno": "02", "cod": "1.11", "nota": "ZR-14658907", "sade": [], "tipo": "INST", "zonas": ["QUEI"], "titulo": "Instrumentação · Manômetros", "det": "Manutenção e calibração, preferencialmente substituir, os 98 indicadores de pressão dos dutos de ar de combustão.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.12", "linha": 35, "forno": "02", "cod": "1.12", "nota": "ZR-14658907", "sade": [], "tipo": "MED", "zonas": ["TUBOS"], "titulo": "Câmara de Radiação Ensaios", "det": "Prover estrutura para medição automatizada em todo o comprimento dos tubos de catalizador remanescentes e manual próximo ao piso do forno;\n\nRealizar a medição de diâmetro em todo o comprimento dos tubos remanescentes com contrato específico ou fornecimento Cenpes. E na base com circômetro e calibre.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.13", "linha": 36, "forno": "02", "cod": "1.13", "nota": "ZR-14658907", "sade": [], "tipo": "REFR", "zonas": ["RAD", "TUN"], "titulo": "Câmara de Radiação Isolamento", "det": "Abrir portas de acesso da radiação;\n\nMontar acesso para inspeção e reparos do refratário da radiação teto, laterais, piso e tuneis, deixando espaço para medição externa dos tubos do forno;\n\nPrever reparos módulos de fibra cerâmica do teto (5m²) e das laterias região das janelas superiores(35m²) e inferiores\n(30m²). DE-5270.00-42311-422-FAB-456;\n\nPrever reparo nas frestas entre a fibra cerâmica e os tunéis de concreto refratário(40metros lineares) E5.(DE-REPLAN-4241-331) / - Trocar mufla G7;\n\nPrever troca de 8 muflas a serem definidas pela IE;\n\nSubstituir 10 lajotas do teto dos tuneis.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.14", "linha": 37, "forno": "02", "cod": "1.14", "nota": "ZR-14658907", "sade": [], "tipo": "CALD", "zonas": ["RAD", "QUEI"], "titulo": "Câmara de Radiação Reparos", "det": "Substituir 6 vidros das janelas de inspeção;\n\nPrever 10m² de chapa de fechamento de forno para o teto, janelas de inspeção e tuneis;\n\nReparar pintura geral (chapas lateriais (D13), tuneis(35m²) e chapas de fundo(230m²);\n\nReparar pintura externa nas regiões das janelas (40m²);\n\nIdentificação dos tubos da radiação com giz na altura das janelas superior e inferior;\n\nDifusores, queimadores, muflas, flexiveis deverão ser manutenidos conforme PE-5AP-02432, escopo do MI/EE. Prever troca de 6 bicos queimadores do tipo interno e 3 do tipo externo;\n\nDumper's deverão ser manutenidos conforme procedimento do MI/ED.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.15", "linha": 38, "forno": "02", "cod": "1.15", "nota": "ZR-14658907", "sade": [], "tipo": "ACESSO", "zonas": ["CONV", "CHAM", "APH", "DUTO"], "titulo": "Convecção", "det": "Abrir todas as portas de acesso convecção e BV’s (dutos de ar frio, ar quente, PAF e chaminé) e montar acesso interno para inspeção nos dutos, refratários e juntas de expansão (DE-REPLAN-4241-42-330, 456, 465 e 466), Atentar para as BV’S 1,2,8, 11, 12, 13, 14, 15,16, 17,19, 20 e a do teto acima dos tubos da convecção;\n\nAbrir tampas das curvas da convecção, 6 tampas (DE-REPLAN-4241-42-011);\n\nMontar acesso ao recuperador de calor (PAF) da convecção na região inferior e superior, Prever instalação de chapas nas extremidades corroidas;\n\nPermutador placa do PAF: Prever neutralização e limpeza no PAF no início da parada de manutenção, com utilização de hidrojato pelos lados superior e inferior do lado do gás;\n\nRealizar ensaio de ultrassom em 24 curvas do lado norte e 12 do lado sul no sistema de Geração de Vapor I ;\n\nPrever acesso externo e preparar região entre os tunéis e o costado para medição de espessura em 14 regiões;\n\nMontar acesso para medição de espessura das curvas e coletores da convecção (DE-REPLAN-4241-42-040).", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.16", "linha": 39, "forno": "02", "cod": "1.16", "nota": "ZR-14658907", "sade": [], "tipo": "MED", "zonas": ["CONV", "VTI", "DUTO"], "titulo": "Convecção", "det": "Preparar pontos para medição de espessura nos seguintes pontos:\n\n1) Gerador de vapor I: lado norte 24 pontos, lado sul 12 pontos;\n2) Pré aquecedor de carga mista: lado norte 9 pontos, lado sul 18 pontos;\n3) Super aquecedor de vapor: lado norte 54 pontos, lado sul 72 pontos;\n4) Gerador de vapor II: lado norte 36 pontos, lado sul 24 pontos.\n\nPrever reparos na manta cerâmica para tampas inferior do lado norte e sul em 10 m²;\n\nPrever reparos no concreto refratário( 2m²) próximo a porta de acesso do lado sul e piso, abaixo dos tubos da convecção;\n\nPrever reparos no concreto refratário do piso(2m²) da convecção;\n\nRealizar reparos de pintura na chaparia, região inferior e laterais, 30m²;\n\nPrever curva de secagem do refratário substituído ou que foi molhado devido neutralização/ensaios;\n\nPrever neutralização e limpeza interna do rotor e da câmara de sucção do VE-F-424102-02;\n\nTrocar a lona da junta de expansão JE-05.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.17", "linha": 40, "forno": "02", "cod": "1.17", "nota": "ZR-14658907", "sade": [], "tipo": "END", "zonas": ["LT"], "titulo": "Linha de Transferência", "det": "Abrir Linha de Transferência e remover poços termopar para inspeção interna; \n\nAvaliar substituição do cone central e weldoletes dos pigtails fixados nos mesmos devido a dificil soldabilidade e ocorrencia de trincas;\n\nRealizar pintura externa com tinta indicadora de alta temperatura conforme N-1514;\n\nPreparar para inspeção tampao do focinho da linha de transferência. DE-REPLAN-4241-42-017 (detalhe J);\n\nRealizar LP nos 3 cones na região da solda dissimilar;\n\nRealizar ensaio de Phased Array nas soldas dissimilares;\n\nRealizar ensaio de Phased/RX para acompanhamento da trinca do \"Tê\" do coletor norte;\n\nRealizar pintura com tinta entumescente nas pernas do forno;\n\nAplicar fire proof na parte metálica das bases da linha de transferência.", "origem": "Licitação", "nt": "Cancelado pelo item 1.20 (substituição integral da LT).", "canc": true}, {"id": "02|1.18", "linha": 41, "forno": "02", "cod": "1.18", "nota": "ZR-14658907", "sade": [], "tipo": "SUP", "zonas": ["COL"], "titulo": "Penthouse", "det": "Montar acesso a cada suporte de mola (14 suportes) dos tubos de distribuição dos pigtail's superiores localizados no penthouse. DE-REPLAN-4241-42-336 e 338;\n\nPrever ajustes nos suportes de mola, caso esteja +H45 fora do valor.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.19", "linha": 42, "forno": "02", "cod": "1.19", "nota": "ZR-14658907", "sade": [], "tipo": "END", "zonas": ["CONV"], "titulo": "LP carga combinada", "det": "Realizar LP visível em 13 soldas circunferenciais nas soldas da tubulação de Carga Combinada próximo a #T” conforme figura 6 da Comunicação Técnica do Cenpes #Adequação do Sistema de Entrada do F-424102 da Replan”; \n\nRealizar LP visível em 6 soldas circunferenciais nas extremidades coletor de saída de Carga Combinada (Mista) na região de convecção do forno conforme solicitado pela Comunicação Técnica do Cenpes #Adequação do Sistema de Entrada do F-424102 da Replan”.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.20", "linha": 43, "forno": "02", "cod": "1.20", "nota": "ZR-14658907", "sade": [], "tipo": "SUBST", "zonas": ["LT"], "titulo": "Linha de transferência", "det": "Substituir a LT integralmente por estratégia de manutenção da Gerência do MA/PM (incluindo os cones). Com isso ficam cancelados os itens 1.2 e 1.17 desta ZR;\n\nAplicar fire proof na parte metálica das bases da linha de transferência.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.21", "linha": 44, "forno": "02", "cod": "1.21", "nota": "ZR-14658907", "sade": ["SADE_060"], "tipo": "CALD", "zonas": ["RAD"], "titulo": "Substituir Cortina", "det": "Correção do item 1.10, as cortinas não devem ser eliminadas, serão substituídas por um sistema novo de cortinas fornecido pelo MA/EE (ordem 2029253228), conforme disponibilidade de cortinas novas, podendo ser parcialmente reutilizadas as que estiverem em melhores condições, se necessário.", "origem": "Licitação", "nt": "Aparece duas vezes na declaração (linha 44 sem SADE e linha 61 com SADE_060). Uma plaqueta só.", "canc": false}, {"id": "02|1.22", "linha": 45, "forno": "02", "cod": "1.22", "nota": "ZR-14658907", "sade": [], "tipo": "SUBST", "zonas": ["CONV"], "titulo": "Carga mista · Serpentina", "det": "Substituir integralmente a serpentina de carga mista desenho DE-REPLAN-4241-42-00042 alterando o material\ndos tubos para P9;\n\nO serviço de substituição da serpentina de carga mista deve conter um critério de protusão máxima interna da solda de 1,6mm, recomendado ensaio de gamagrafia das soldas. Ação originada no grupo de trabalho de falha da serpentina.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.23", "linha": 46, "forno": "02", "cod": "1.23", "nota": "ZR-14658907", "sade": [], "tipo": "CALD", "zonas": ["CONV"], "titulo": "Carga mista · Suporte", "det": "Substituir o 3º e 4º suportes da serpentina de carga mista (contando de norte para sul) conforme DE-REPLAN-4241-42-00046;\n\nAlternativa no caso de indisponibilidade: instalar viga de reforço nos dois suportes.", "origem": "Licitação", "nt": "", "canc": false}, {"id": "02|1.24", "linha": 47, "forno": "02", "cod": "1.24", "nota": "ZR-14658907", "sade": [], "tipo": "REFR", "zonas": ["CONV", "TRANS", "TUN"], "titulo": "Convecção · Refratário Inferior", "det": "Substituir o refratário do teto dos dois túneis/dutos de transição das extremidades (aprox. 15m²);\n\nSubstituir o refratário na convecção da face norte, sul e leste, do piso até altura de aproximadamente 3m (aprox. 71m²); \n\nRealizar reparos nas paredes dos túneis/dutos de transição (aprox. 20m²);\n\nOs materiais de projeto podem ser substituídos por itens comerciais desde que manti    a consulta grava cada registro assinado com PIN aqui; painel, 3D, planejamento e TV leem na abertura
   e quando outra aba grava (evento storage). Sem banco: fica só neste navegador. */
const REG_KEY='sigma-fornos-registros',HOJE_DEMO='2027-03-10';
function regsSalvos(){try{return JSON.parse(localStorage.getItem(REG_KEY)||'{}')||{}}catch(e){return {}}}
function guardaReg(id,r){const s=regsSalvos();(s[id]=s[id]||[]).push(r);try{localStorage.setItem(REG_KEY,JSON.stringify(s))}catch(e){}}
function zeraRegs(){try{localStorage.removeItem(REG_KEY)}catch(e){};aplicaSalvos()}
function nRegsSalvos(){return Object.values(regsSalvos()).reduce((a,l)=>a+l.length,0)}
function aplicaSalvos(){const s=regsSalvos();
  ITENS.forEach(p=>{if(!p._b)p._b={reg:p.reg.slice(),feitas:p.feitas,estado:p.estado,pend:p.pend};else{p.reg=p._b.reg.slice();p.feitas=p._b.feitas;p.estado=p._b.estado;if(p._b.pend)p.pend=p._b.pend;else delete p.pend}});
  Object.entries(s).forEach(([id,l])=>{const p=ITENS.find(x=>x.id===id);if(!p||p.canc)return;const n=TIPOS[p.tipo].e.length;
    l.forEach(r=>{if(p.feitas>=n)return;p.reg.push(Object.assign({},r,{et:p.feitas}));if(r.res!=='Não')p.feitas++;
      p.estado=p.feitas>=n?'lib':r.res==='Não'?'pen':(TIPOS[p.tipo].e[p.feitas][1]==='Inspeção'?'esp':'and');if(p.pend&&p.feitas>=n)delete p.pend})})}
aplicaSalvos();

const SUPS=[
 {p:EXTRA[0],frente:'Caldeiraria e soldagem',grupos:['Caldeiraria / Produção','Caldeiraria e Soldagem / Produção'],base:16},
 {p:EXTRA[1],frente:'Refratário, andaime, isolamento, pintura e instrumentação',grupos:['Complementar / Produção'],base:22},
 {p:EXTRA[2],frente:'Inspeção e END',grupos:['Inspeção'],base:5}];
SUPS.forEach(s=>s.equipe=EFETIVO.filter(e=>s.grupos.includes(e.grupo)));
const funcaoDe=n=>(EFETIVO.find(e=>e.nome===n)||EXTRA.find(e=>e.nome===n)||{}).funcao||'';

/* ---------- base de exemplo ---------- */
const ATIVAS=ITENS.filter(p=>!p.canc);
const HOJE=ATIVAS.flatMap(p=>p.reg.map(r=>r.quando)).sort().pop();
const ETS=p=>TIPOS[p.tipo].e;
const proxEt=p=>p.feitas<ETS(p).length?ETS(p)[p.feitas]:null;
const zonaDe=p=>ZN(p.forno,p.zonas[0])||{num:'',nome:p.zonas[0]};
const corZ=p=>`var(--s-${p.estado==='canc'?'nao':p.estado})`;
const linkP=p=>`consulta.html#${SLUG[p.forno]}/p/${encodeURIComponent(p.cod)}`;
const dataBR=d=>d?fmt(d):'·';
const FO_ORD=['02','01','8A','8B','P3'];

/* distribuição de hoje: próxima etapa de cada plaqueta para quem é do ofício */
const DIST={};
ATIVAS.forEach(p=>{const et=proxEt(p);if(!et||et[1]==='Planejamento')return;const r=hash('d'+p.id);if(r<.15)return;
  DIST[p.id]={quem:pessoaPara(et[1],hash(p.id+p.feitas),p.tipo).nome,prio:p.pend||(p.forno==='02'&&['TUBOS','COL','LT'].includes(p.zonas[0]))?1:r<.6?2:3}});
function prog(d){const out=[];
  ATIVAS.forEach(p=>p.reg.forEach(r=>{if(r.quando===d)out.push({p,et:r.et,quem:r.quem,prio:1+Math.floor(hash(p.id+r.et)*3),feito:true})}));
  if(d===HOJE)Object.entries(DIST).forEach(([id,a])=>{const p=ITENS.find(x=>x.id===id);out.push({p,et:p.feitas,quem:a.quem,prio:a.prio,feito:false})});
  return out}

/* RDC por supervisor e dia */
const RDC={};
function rdcDe(s,d){const k=s.p.mat+'|'+d;if(k in RDC)return RDC[k];let v=null;
  if(d===HOJE){const i=SUPS.indexOf(s);v=i===0?{status:'rascunho'}:i===1?{status:'fechado'}:null}
  else if(d<HOJE&&d>='2027-03-01'&&hash(k)>.1)v={status:'fechado'};
  if(v){v.turno='DIA';v.pt=`PT ${s.p.mat.slice(-3)}${d.slice(-2)}/27`;v.efetivo=s.base+Math.floor(hash(k+'e')*4);v.obs=''}
  return RDC[k]=v}
function prodDe(s,d){const nomes=new Set(s.equipe.map(e=>e.nome)),pg=prog(d).filter(a=>nomes.has(a.quem));
  const feitos=pg.filter(a=>a.feito),plq=new Set(pg.map(a=>a.p.id)),conc=new Set(feitos.map(a=>a.p.id));
  return {etapas:feitos.length,decl:plq.size,conc:conc.size,atrib:pg.length,feitos:feitos.length,lista:pg}}
function avanco(s){let prev=0,cump=0;ATIVAS.forEach(p=>ETS(p).forEach((e,i)=>{if(s.grupos.includes(e[1])){prev++;if(i<p.feitas)cump++}}));
  return {prev,cump,pct:prev?Math.round(cump*100/prev):0}}

/* recursos levantados em campo, por plaqueta */
const QRZ={};FO_ORD.forEach(fo=>(FORNOS[fo].zonas||[]).forEach(z=>{QRZ[fo+'|'+z.cod]=hash('q'+fo+z.cod)<.72}));
function recDe(p){if(p._rec!==undefined)return p._rec;const r=hash('r'+p.id),z=p.zonas,t=p.tipo,c=s=>z.includes(s);
  if(r<.14)return p._rec=null;
  const alto=c('RAD')||c('CONV')||c('TRANS')||c('TUBOS')||c('COL')||c('APH')||c('SERP')||t==='ACESSO'||t==='REFR';
  const and=alto?'sim':(c('CHAM')||c('DUTO'))?(r<.5?'nao_sei':'nao'):'nao';
  const dim=and!=='sim'?'':c('RAD')||c('TUBOS')||c('SERP')?'Interno à radiação, 12 × 6 × 14 m':c('CONV')?'Externo à convecção, 4 × 2 × 9 m':c('COL')?'Penthouse, 6 × 2 × 3 m':'2 × 2 × 6 m';
  const carga=t==='SUBST'?(p.cod==='1.5'||p.cod==='1.20'?['guindaste']:['munck']):t==='QUEI'||t==='DAMP'?['talha']:c('VTF')||c('VTI')?['munck']:[];
  const pe=pessoaPara('Complementar / Produção',r,'ACESSO');
  return p._rec={andaime:and,dim,alpinismo:c('CHAM')&&t!=='ACESSO'?'sim':c('DUTO')&&r>.7?'nao_sei':'nao',carga,
    isolamento:c('LT')||c('COL')||t==='ISOL'||(t==='END'&&r>.5)?'sim':'nao',pintura:t==='PINT'||c('CHAM')||c('EST')?'sim':'nao',
    encarregado:['CALD','SUBST'].includes(t)?'Edson Furtado':'Antônio Bezerra',por:pe.nome,quando:`2027-02-${String(10+Math.floor(r*15)).padStart(2,'0')}`}}

/* dados informados em campo que o planejamento confere */
const CONF=[];
ATIVAS.forEach(p=>{const r=hash('c'+p.id);if(!p.reg.length||r>.42)return;const u=p.reg[p.reg.length-1],z=zonaDe(p);let campo,inf;
  if(['REFR','ACESSO'].includes(p.tipo)){campo='Recursos';inf=p.tipo==='REFR'?`Área a reparar levantada em campo: ${(1+r*8).toFixed(1).replace('.',',')} m²`:`Andaime: ${recDe(p)&&recDe(p).dim||'3 × 2 × 8 m'}`}
  else if(['MED','END'].includes(p.tipo)){campo='Quantidade';inf=`${10+Math.floor(r*90)} pontos acessíveis, ${Math.floor(r*6)} sem acesso`}
  else{campo='Localização';inf=`${z.nome}, elevação ${(4+Math.floor(r*30))} m, face ${['norte','sul','leste','oeste'][Math.floor(r*4)]}`}
  CONF.push({id:'c'+p.id,p,campo,inf,quem:u.quem,quando:u.quando,st:'pend'})});
FO_ORD.forEach(fo=>(FORNOS[fo].zonas||[]).forEach(z=>{if(QRZ[fo+'|'+z.cod]&&hash('qc'+fo+z.cod)<.3){const p=ATIVAS.find(x=>x.forno===fo&&x.zonas.includes(z.cod));if(p)
  CONF.push({id:'q'+fo+z.cod,p,campo:'Placa QR da zona',inf:`Placa da zona ${z.num} · ${z.nome} instalada no acesso`,quem:'Antônio Bezerra',quando:'2027-02-26',st:'pend'})}}));

/* ---------- sessão (só nesta aba, como no Sigma Campo) ---------- */
let PESSOA=null;
function telaLogin(){
  $('app').innerHTML=`<div class="login"><h1>Portal do Planejamento</h1>
   <p class="lead">Entrada restrita. Digite seu nome e confirme com o seu PIN de campo. Fica só nesta aba: se fechar ou recarregar, pede de novo.</p>
   <div class="fg"><label for="lg-n">Seu nome</label><input class="inp" id="lg-n" autocomplete="off" placeholder="Ex.: Fernanda Lacerda"></div>
   <div id="lg-r"></div>
   <div class="fg" id="lg-pw" hidden style="margin-top:12px"><label for="lg-p">Seu PIN (4 dígitos)</label><input class="inp pin" id="lg-p" inputmode="numeric" maxlength="4" placeholder="••••"></div>
   <div class="miss" id="lg-e" hidden></div>
   <button type="button" class="bt bt-p" id="lg-b" hidden style="width:100%;margin-top:12px">Entrar</button>
   <div class="dica">Demonstração: entram Fernanda Lacerda, Gustavo Reis e Carlos Menezes, todos com o PIN 1234.</div></div>`;
  let sel=null;
  const escolher=u=>{sel=u;$('lg-r').innerHTML=`<div class="hit"><span class="av">${ini(u.nome)}</span><div><b>${esc(u.nome)}</b><div class="sub2">${esc(u.funcao)} · ${esc(u.motivo)}</div></div></div>`;
    $('lg-pw').hidden=false;$('lg-b').hidden=false;$('lg-p').focus()};
  $('lg-n').oninput=()=>{const t=$('lg-n').value.trim().toLowerCase();sel=null;$('lg-pw').hidden=true;$('lg-b').hidden=true;$('lg-e').hidden=true;
    if(t.length<3){$('lg-r').innerHTML='';return}
    const a=PERMITIDOS.filter(p=>[p.nome,p.funcao,p.mat].join(' ').toLowerCase().includes(t));
    if(!a.length){$('lg-r').innerHTML='<div class="miss">Este portal é restrito e seu nome não está liberado. Fale com o Planejamento.</div>';return}
    if(a.length===1)return escolher(a[0]);
    $('lg-r').innerHTML='<div class="pick">'+a.map((u,i)=>`<button type="button" data-i="${i}"><b>${esc(u.nome)}</b><small>${esc(u.funcao)} · ${esc(u.motivo)}</small></button>`).join('')+'</div>';
    $('lg-r').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>escolher(a[+b.dataset.i]))};
  const entrar=()=>{if(!sel)return;if($('lg-p').value!==PIN_DEMO){$('lg-e').textContent='PIN não confere. Tente de novo.';$('lg-e').hidden=false;$('lg-p').value='';return}
    PESSOA=sel;$('quem').innerHTML=`${esc(sel.nome)}<small>${esc(sel.funcao)}</small>`;$('quem').hidden=false;$('b-sair').hidden=false;toast('Entrada confirmada. Bom trabalho, '+sel.nome.split(' ')[0]+'.');rota()};
  $('lg-b').onclick=entrar;$('lg-p').onkeydown=e=>{if(e.key==='Enter')entrar()};$('lg-n').focus()}
$('b-sair').onclick=()=>{PESSOA=null;$('quem').hidden=true;$('b-sair').hidden=true;history.replaceState(null,'',location.pathname);telaLogin()};
const assina=()=>({quem:PESSOA.nome,quando:new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})});

/* ---------- RDC ---------- */
let rData=null;
function telaRdc(){rData=rData||HOJE;
  $('app').innerHTML=`<div>${VOLTA}<div class="head"><h1>RDC · Relatório Diário de Campo</h1><p>Um cartão por supervisor, com a produtividade do dia e o acesso ao RDC. O efetivo vem do próprio RDC e as etapas vêm dos registros com PIN da equipe dele.</p></div></div>
   <div class="bar"><div class="fg"><label for="r-d">Data</label><input type="date" class="inp" id="r-d" value="${rData}" min="2027-03-01" max="2027-03-31"></div>
    <div class="fg busca"><label for="r-b">Supervisor</label><input class="inp busca" id="r-b" placeholder="Nome, função ou frente"></div></div>
   <div class="kpis p" id="r-k"></div><div id="r-c"></div>`;
  $('r-d').onchange=()=>{rData=$('r-d').value||HOJE;rdcCards()};$('r-b').oninput=rdcCards;rdcCards()}
function rdcCards(){const t=($('r-b').value||'').toLowerCase();
  const L=SUPS.filter(s=>!t||[s.p.nome,s.p.funcao,s.frente].join(' ').toLowerCase().includes(t)).map(s=>({s,r:rdcDe(s,rData),pd:prodDe(s,rData),av:avanco(s)}));
  const com=L.filter(x=>x.r);
  $('r-k').innerHTML=kpi(L.length,'Supervisores')+kpi(com.length,'RDC aberto no dia')+kpi(com.filter(x=>x.r.status==='fechado').length,'RDC fechado')+kpi(com.reduce((a,x)=>a+x.r.efetivo,0),'Efetivo declarado')+kpi(L.reduce((a,x)=>a+x.pd.etapas,0),'Etapas registradas')+kpi(`${L.reduce((a,x)=>a+x.pd.conc,0)} / ${L.reduce((a,x)=>a+x.pd.decl,0)}`,'Plaquetas trabalhadas');
  if(rData>HOJE){$('r-c').innerHTML=`<div class="vazio"><b>${dataBR(rData)} ainda não chegou</b>O RDC é aberto pelo supervisor no próprio dia.</div>`;return}
  $('r-c').innerHTML=`<div class="cards">${L.map(({s,r,pd,av})=>{const selo=!r?'<span class="selo ausente">Sem RDC</span>':r.status==='fechado'?'<span class="selo fechado">RDC fechado</span>':'<span class="selo rascunho">Rascunho</span>';
    return `<div class="card${r?'':' sem'}"><div class="topo"><span class="av">${ini(s.p.nome)}</span><div><div class="nm">${esc(s.p.nome)}</div><div class="fx2">${esc(s.p.funcao)}${r?' · turno dia':''}</div></div>${selo}</div>
     ${r?`<div class="nbs"><div class="nb"><b>${r.efetivo}</b><span>Efetivo presente</span></div><div class="nb"><b>${pd.conc}/${pd.decl}</b><span>Plaquetas do RDC</span></div><div class="nb"><b>${pd.etapas}</b><span>Etapas em campo</span></div></div>
      <div class="nbs" style="grid-template-columns:1fr 1fr"><div class="nb"><b>${pd.feitos}/${pd.atrib}</b><span>Etapas feitas sobre distribuídas</span></div><div class="nb"><b>${r.efetivo?(pd.etapas/r.efetivo).toFixed(1).replace('.',','):'·'}</b><span>Etapas por pessoa</span></div></div>`
      :`<div class="nb" style="text-align:left"><span style="font-size:11.5px;line-height:1.5">Sem relatório aberto nesta data. Abra o RDC para declarar o efetivo, a PT e as plaquetas trabalhadas.</span></div>`}
     <div><div class="frente">Frente: ${esc(s.frente)}</div><div class="pbar"><i style="width:${av.pct}%"></i></div><div class="pcts"><span>${av.pct}% de avanço acumulado</span><span>${av.cump} de ${av.prev} etapas</span></div></div>
     <div class="acs"><button type="button" class="bt bt-p" data-rdc="${s.p.mat}">${r?'Abrir RDC':'Abrir RDC do dia'}</button>${r?`<button type="button" class="bt bt-g" data-rpdf="${s.p.mat}">PDF</button>`:''}</div></div>`}).join('')}</div>`;
  document.querySelectorAll('[data-rdc]').forEach(b=>b.onclick=()=>abrirRdc(SUPS.find(s=>s.p.mat===b.dataset.rdc)));
  document.querySelectorAll('[data-rpdf]').forEach(b=>b.onclick=()=>imprimir([folhaRdc(SUPS.find(s=>s.p.mat===b.dataset.rpdf))]))}
function abrirRdc(s){let r=rdcDe(s,rData);
  if(!r){r=RDC[s.p.mat+'|'+rData]={status:'rascunho',turno:'DIA',pt:`PT ${s.p.mat.slice(-3)}${rData.slice(-2)}/27`,efetivo:s.equipe.length,obs:''};toast('RDC do dia aberto em rascunho.')}
  const pd=prodDe(s,rData);
  modal(`<button class="x" data-fecha aria-label="Fechar">×</button><h2>RDC · ${esc(s.p.nome)}</h2><div class="sub2">${dataBR(rData)} · turno dia · ${esc(r.pt)} · ${r.status==='fechado'?'fechado':'rascunho'}</div>
   <h3>Efetivo presente (${r.efetivo})</h3><div class="efl">${s.equipe.map(e=>`<span>${esc(e.nome)} · ${esc(e.funcao)}</span>`).join('')}<span>${Math.max(0,r.efetivo-s.equipe.length)} ajudantes e meio-oficiais</span></div>
   <h3>Plaquetas trabalhadas</h3>${pd.lista.length?`<div class="tw"><table><thead><tr><th>Plaqueta</th><th>Forno · zona</th><th>Etapa</th><th>Quem</th><th>Situação</th></tr></thead><tbody>${pd.lista.map(a=>`<tr><td class="cod"><a href="${linkP(a.p)}" target="_blank" rel="noopener">${esc(a.p.cod)}</a></td><td>${esc(FORNOS[a.p.forno].tag)} · ${esc(zonaDe(a.p).nome)}</td><td>${esc(ETS(a.p)[a.et][0])}</td><td>${esc(a.quem)}</td><td>${a.feito?'<span class="sn ok">Feita</span>':'<span class="sn pend">Programada</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="vz">Nenhuma plaqueta neste dia.</p>'}
   <h3>Observações</h3><textarea class="inp" id="rdc-o" rows="3" ${r.status==='fechado'?'disabled':''} placeholder="Interferências, chuva, espera de PT, falta de material">${esc(r.obs||'')}</textarea>
   <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button type="button" class="bt bt-g" id="rdc-pdf">PDF</button>${r.status!=='fechado'?'<button type="button" class="bt bt-v" id="rdc-f">Fechar RDC com meu PIN</button>':''}</div>`);
  $('rdc-pdf').onclick=()=>{r.obs=$('rdc-o').value;imprimir([folhaRdc(s)])};
  if($('rdc-f'))$('rdc-f').onclick=()=>{r.obs=$('rdc-o').value;r.status='fechado';r.fech=assina();fechaModal();toast('RDC fechado e assinado por '+PESSOA.nome+'.');rdcCards()}}

/* ---------- programação diária e distribuir hoje ---------- */
let pData=null;
function telaProg(){pData=pData||HOJE;
  $('app').innerHTML=`<div>${VOLTA}<div class="head"><h1>Programação diária</h1><p>Uma folha por colaborador com as plaquetas que ele recebeu na distribuição do dia, na ordem forno, zona e prioridade. A distribuição é feita em Distribuir hoje.</p></div></div>
   <div class="bar"><div class="fg"><label for="p-d">Data</label><input type="date" class="inp" id="p-d" value="${pData}" min="2027-03-01" max="2027-03-31"></div><div class="sp"></div>
    <button type="button" class="bt bt-g" data-ir="distribuir">Distribuir hoje</button><button type="button" class="bt bt-v" id="p-all">Gerar programação (todos)</button></div>
   <div class="kpis p" id="p-k"></div><div id="p-c"></div>`;
  $('p-d').onchange=()=>{pData=$('p-d').value||HOJE;progLista()};$('p-all').onclick=()=>{const g=progPor();imprimir(Object.keys(g).sort().flatMap(n=>folhaProg(n,g[n])))};progLista()}
function progPor(){const g={};prog(pData).forEach(a=>(g[a.quem]=g[a.quem]||[]).push(a));return g}
function progLista(){const pg=prog(pData),g=progPor(),nomes=Object.keys(g).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  $('p-k').innerHTML=kpi(pg.length,'Etapas distribuídas')+kpi(nomes.length,'Colaboradores com programação')+kpi(new Set(pg.map(a=>a.p.id)).size,'Plaquetas')+kpi([...new Set(pg.map(a=>FORNOS[a.p.forno].tag))].join(', ')||'·','Fornos');
  $('p-all').disabled=!nomes.length;
  if(!nomes.length){$('p-c').innerHTML=`<div class="vazio"><b>Ninguém recebeu plaqueta em ${dataBR(pData)}</b>${pData>HOJE?'A distribuição vale só para o dia em que foi feita.':'Use Distribuir hoje para escolher as plaquetas e o colaborador de cada uma.'}</div>`;return}
  $('p-c').innerHTML='<div class="plist">'+nomes.map((n,i)=>{const l=g[n],pf={};l.forEach(a=>{const k=FORNOS[a.p.forno].tag;pf[k]=(pf[k]||0)+1});
    const pp=[1,2,3].filter(k=>l.some(a=>a.prio===k)).map(k=>`P${k}: ${l.filter(a=>a.prio===k).length}`).join(' · ');
    return `<div class="prow"><span class="av">${ini(n)}</span><div style="flex:1;min-width:0"><div class="nm">${esc(n)} · ${esc(funcaoDe(n))} · ${l.length} ${l.length>1?'etapas':'etapa'}</div>
     <div class="fx2">${Object.entries(pf).map(([k,v])=>`${k} (${v})`).join(' · ')} · ${pp}${l.some(a=>a.feito)?` · ${l.filter(a=>a.feito).length} feitas`:''}</div></div>
     <button type="button" class="bt bt-g" data-pn="${i}">PDF</button></div>`}).join('')+'</div>';
  document.querySelectorAll('[data-pn]').forEach(b=>b.onclick=()=>{const n=nomes[+b.dataset.pn];imprimir(folhaProg(n,g[n]))})}
function telaDistribuir(){const L=ATIVAS.filter(p=>{const e=proxEt(p);return e&&e[1]!=='Planejamento'}).sort((a,b)=>FO_ORD.indexOf(a.forno)-FO_ORD.indexOf(b.forno)||String(zonaDe(a).num).localeCompare(String(zonaDe(b).num)));
  const draft=JSON.parse(JSON.stringify(DIST));
  $('app').innerHTML=`<div><button type="button" class="voltar" data-ir="programacao">${svg('<path d="M19 12H5M11 18l-6-6 6-6"/>')}Voltar à programação</button><div class="head"><h1>Distribuir hoje · ${dataBR(HOJE)}</h1><p>Cada linha é a próxima etapa de uma plaqueta. A lista de pessoas mostra primeiro quem é da função da etapa. Linha azul: mudou e ainda não foi salva.</p></div></div>
   <div class="bar"><div class="fg"><label for="d-f">Forno</label><select id="d-f"><option value="">Todos</option>${FO_ORD.map(k=>`<option value="${k}">${FORNOS[k].tag}</option>`).join('')}</select></div>
    <div class="fg"><label for="d-v">Mostrar</label><select id="d-v"><option value="">Todas</option><option value="sem">Sem colaborador</option><option value="p1">Prioridade 1</option></select></div><div class="sp"></div>
    <button type="button" class="bt bt-p" id="d-s">Salvar distribuição</button></div><div id="d-c"></div>`;
  const desenha=()=>{const f=$('d-f').value,v=$('d-v').value;const l=L.filter(p=>(!f||p.forno===f)&&(!v||(v==='sem'?!draft[p.id]:draft[p.id]&&draft[p.id].prio===1)));
    $('d-c').innerHTML=l.length?`<div class="tw"><table><thead><tr><th>Plaqueta</th><th>Forno · zona</th><th>Próxima etapa</th><th>Colaborador</th><th>Prioridade</th></tr></thead><tbody>${l.map(p=>{const e=proxEt(p),a=draft[p.id]||{},ord=[...EFETIVO.filter(x=>x.grupo===e[1]),...EFETIVO.filter(x=>x.grupo!==e[1]&&x.grupo!=='Planejamento')];
      const mud=JSON.stringify(a)!==JSON.stringify(DIST[p.id]||{});
      return `<tr class="${mud?'mud':''}"><td><div class="cod"><a href="${linkP(p)}" target="_blank" rel="noopener">${esc(p.cod)}</a></div><div class="sub2">${esc(p.titulo)}</div></td>
       <td><span class="zn2" style="background:${corZ(p)}">${esc(zonaDe(p).num)}</span>${esc(FORNOS[p.forno].tag)} · ${esc(zonaDe(p).nome)}</td>
       <td>${esc(e[0])}<div class="sub2">${esc(e[1])}</div></td>
       <td><select data-q="${p.id}" aria-label="Colaborador da plaqueta ${esc(p.cod)}"><option value="">Sem colaborador</option>${ord.map(x=>`<option ${a.quem===x.nome?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></td>
       <td><select data-pr="${p.id}" aria-label="Prioridade"><option value="1" ${a.prio===1?'selected':''}>P1</option><option value="2" ${a.prio===2?'selected':''}>P2</option><option value="3" ${a.prio===3||!a.prio?'selected':''}>P3</option></select></td></tr>`}).join('')}</tbody></table></div>`:'<div class="vazio"><b>Nada neste filtro</b></div>';
    $('d-c').querySelectorAll('[data-q]').forEach(s=>s.onchange=()=>{const id=s.dataset.q;if(!s.value)delete draft[id];else draft[id]={quem:s.value,prio:(draft[id]||{}).prio||3};desenha()});
    $('d-c').querySelectorAll('[data-pr]').forEach(s=>s.onchange=()=>{const id=s.dataset.pr;if(draft[id]){draft[id].prio=+s.value;desenha()}})};
  $('d-f').onchange=desenha;$('d-v').onchange=desenha;
  $('d-s').onclick=()=>{Object.keys(DIST).forEach(k=>delete DIST[k]);Object.assign(DIST,draft);toast(`Distribuição salva por ${PESSOA.nome}: ${Object.keys(DIST).length} plaquetas.`);desenha()};desenha()}

/* ---------- etapas do planejamento ---------- */
function telaEtapas(){
  const pend=ATIVAS.filter(p=>{const e=proxEt(p);return e&&e[1]==='Planejamento'});
  const feitas=ATIVAS.flatMap(p=>p.reg.filter(r=>ETS(p)[r.et][1]==='Planejamento').map(r=>({p,r})));
  $('app').innerHTML=`<div>${VOLTA}<div class="head"><h1>Etapas do planejamento</h1><p>Etapas do workflow que são do Planejamento. Enquanto elas não fecham, a plaqueta não anda para o campo. Marcar como feita assina com o seu PIN.</p></div></div>
   <div class="kpis p">${kpi(pend.filter(p=>!PLAN_OK[p.id]).length,'Aguardando o Planejamento')+kpi(Object.keys(PLAN_OK).length,'Fechadas nesta sessão')+kpi(feitas.length,'Já feitas antes')}</div>
   <div class="tw"><table><thead><tr><th>Plaqueta</th><th>Forno · zona</th><th>Etapa</th><th>Situação</th><th></th></tr></thead><tbody>
   ${pend.map(p=>{const ok=PLAN_OK[p.id];return `<tr><td><div class="cod"><a href="${linkP(p)}" target="_blank" rel="noopener">${esc(p.cod)}</a></div><div class="sub2">${esc(p.titulo)}</div></td><td><span class="zn2" style="background:${corZ(p)}">${esc(zonaDe(p).num)}</span>${esc(FORNOS[p.forno].tag)} · ${esc(zonaDe(p).nome)}</td>
     <td>${esc(proxEt(p)[0])}</td><td>${ok?`<span class="sn ok">Feita</span><div class="sub2">${esc(ok.quem)} · ${esc(ok.quando)}</div>`:'<span class="sn pend">Pendente</span>'}</td>
     <td>${ok?'':`<button type="button" class="bt bt-v" data-ok="${p.id}">Marcar como feita</button>`}</td></tr>`}).join('')}
   ${feitas.map(({p,r})=>`<tr><td><div class="cod"><a href="${linkP(p)}" target="_blank" rel="noopener">${esc(p.cod)}</a></div><div class="sub2">${esc(p.titulo)}</div></td><td><span class="zn2" style="background:${corZ(p)}">${esc(zonaDe(p).num)}</span>${esc(FORNOS[p.forno].tag)} · ${esc(zonaDe(p).nome)}</td><td>${esc(ETS(p)[r.et][0])}</td><td><span class="sn ok">Feita</span><div class="sub2">${esc(r.quem)} · ${dataBR(r.quando)}</div></td><td></td></tr>`).join('')}
   </tbody></table></div>`;
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{PLAN_OK[b.dataset.ok]=assina();toast('Etapa fechada e assinada por '+PESSOA.nome+'.');telaEtapas()})}

/* ---------- etiquetas com QR ---------- */
const CESTA=new Set();let eFo='02',eModo='z',ePos=1;
function itensEtq(){return eModo==='z'?(FORNOS[eFo].zonas||[]).map(z=>({k:`z|${eFo}|${z.cod}`,num:z.num,t:z.nome,s:(QRZ[eFo+'|'+z.cod]?'placa já instalada':'sem placa instalada')+' · '+(n=>n===0?'sem item na declaração':n+(n>1?' plaquetas':' plaqueta'))(ATIVAS.filter(p=>p.forno===eFo&&p.zonas.includes(z.cod)).length),cor:`var(--s-${(estZona(eFo,z.cod)||{}).k||'nao'})`}))
  :ATIVAS.filter(p=>p.forno===eFo).map(p=>({k:`p|${eFo}|${p.cod}`,num:zonaDe(p).num,t:`${p.cod} · ${p.titulo}`,s:FORNOS[eFo].tag+' · '+zonaDe(p).nome,cor:corZ(p)}))}
function telaEtiquetas(){
  $('app').innerHTML=`<div>${VOLTA}<div class="head"><h1>Confecção de etiquetas</h1><p>A placa da zona leva o QR que abre a zona na consulta: quem aponta o celular vê as plaquetas daquela parte do forno. Folha A4 de 21 etiquetas (63,5 × 38,1 mm). A cesta guarda a escolha ao trocar de forno.</p></div></div>
   <div class="bar"><div class="fg"><label>Etiqueta de</label><div class="abas" style="display:flex;gap:6px"><button type="button" class="uchip" data-m="z" aria-pressed="${eModo==='z'}">Zona (placa QR)</button><button type="button" class="uchip" data-m="p" aria-pressed="${eModo==='p'}">Plaqueta (pasta)</button></div></div>
    <div class="fg"><label>Forno</label><div style="display:flex;gap:6px;flex-wrap:wrap">${FO_ORD.map(k=>`<button type="button" class="uchip" data-efo="${k}" aria-pressed="${k===eFo}">${FORNOS[k].tag}</button>`).join('')}</div></div></div>
   <div class="etq"><section class="panel"><div class="panel-h"><div><div class="tt">${eModo==='z'?'Zonas':'Plaquetas'} do ${esc(FORNOS[eFo].tag)}</div><div class="q">Marque o que vai para a folha</div></div>
     <div class="acoes"><button type="button" class="hbtn" id="e-all">Marcar todas</button>${eModo==='z'?'<button type="button" class="hbtn" id="e-sem">Só as sem placa</button>':''}<button type="button" class="hbtn" id="e-none">Limpar</button></div></div><div class="elista" id="e-l"></div></section>
    <section class="panel"><div class="panel-h"><div><div class="tt">Cesta e folha</div><div class="q">Toque na posição da folha onde começa a impressão</div></div></div><div class="cesta" id="e-c"></div></section></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{eModo=b.dataset.m;telaEtiquetas()});
  document.querySelectorAll('[data-efo]').forEach(b=>b.onclick=()=>{eFo=b.dataset.efo;telaEtiquetas()});
  $('e-all').onclick=()=>{itensEtq().forEach(i=>CESTA.add(i.k));etqLista()};$('e-none').onclick=()=>{CESTA.clear();etqLista()};

function etqLista(){
